[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Friendly /api/* routes -> serverless functions (the AGENT plane).
[[redirects]]
  from = "/api/agent-init"
  to = "/.netlify/functions/agent-init"
  status = 200
[[redirects]]
  from = "/api/agent-status"
  to = "/.netlify/functions/agent-status"
  status = 200
[[redirects]]
  from = "/api/agent-act"
  to = "/.netlify/functions/agent-act"
  status = 200
[[redirects]]
  from = "/api/predict-analyze"
  to = "/.netlify/functions/predict-analyze"
  status = 200
[[redirects]]
  from = "/api/predict-bet"
  to = "/.netlify/functions/predict-bet"
  status = 200
# Resolution-proposal plane: agent researches the real-world outcome and
# PROPOSES a resolution with sources. READ ONLY — a human commits it manually
# via `cast send resolveMarket(...)`. This function never signs or sends.
[[redirects]]
  from = "/api/predict-resolve-propose"
  to = "/.netlify/functions/predict-resolve-propose"
  status = 200

# Async analyst plane: start kicks off the background function, status polls it.
# The -background function is invoked internally by predict-start, so it needs
# no friendly /api alias of its own.
[[redirects]]
  from = "/api/predict-start"
  to = "/.netlify/functions/predict-start"
  status = 200
[[redirects]]
  from = "/api/predict-status"
  to = "/.netlify/functions/predict-status"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  # Web search + multi-round reasoning needs more than the 30s default
  included_files = []
[functions."predict-analyze"]
  timeout = 60
[functions."predict-resolve-propose"]
  timeout = 60
