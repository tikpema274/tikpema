[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Friendly /api/* routes -> serverless functions (the AGENT plane).
[[redirects]]
  from = "/api/agent-init"
  to = "/.netlify/functions/agent-init"
  status = 200
[[redirects]]
  from = "/api/agent-status"
  to = "/.netlify/functions/agent-status"
  status = 200
[[redirects]]
  from = "/api/agent-act"
  to = "/.netlify/functions/agent-act"
  status = 200
[[redirects]]
  from = "/api/agent-execute-plan"
  to = "/.netlify/functions/agent-execute-plan"
  status = 200
[[redirects]]
  from = "/api/predict-markets"
  to = "/.netlify/functions/predict-markets"
  status = 200
[[redirects]]
  from = "/api/predict-analyze"
  to = "/.netlify/functions/predict-analyze"
  status = 200
[[redirects]]
  from = "/api/predict-bet"
  to = "/.netlify/functions/predict-bet"
  status = 200

# Gateway plane: deposit USDC into the Circle Gateway Wallet (unified balance)
# and read the unified balance back. Deposit EXECUTES via the dev-controlled
# wallet; balance is a read-only Gateway API call.
[[redirects]]
  from = "/api/gateway-deposit"
  to = "/.netlify/functions/gateway-deposit"
  status = 200
[[redirects]]
  from = "/api/gateway-balance"
  to = "/.netlify/functions/gateway-balance"
  status = 200

# Resolution-proposal plane: agent researches the real-world outcome and
# PROPOSES a resolution with sources. READ ONLY — a human commits it manually
# via `cast send resolveMarket(...)`. This function never signs or sends.
[[redirects]]
  from = "/api/predict-resolve-propose"
  to = "/.netlify/functions/predict-resolve-propose"
  status = 200

# Async analyst plane: start kicks off the background function, status polls it.
# The -background function is invoked internally by predict-start, so it needs
# no friendly /api alias of its own.
[[redirects]]
  from = "/api/predict-start"
  to = "/.netlify/functions/predict-start"
  status = 200
[[redirects]]
  from = "/api/predict-status"
  to = "/.netlify/functions/predict-status"
  status = 200

# Async resolution-proposal plane: start kicks off predict-resolve-background,
# which writes to the same "predict-jobs" store, so it reuses predict-status for
# polling. The -background function is invoked internally by predict-resolve-
# start, so it needs no friendly /api alias of its own.
[[redirects]]
  from = "/api/predict-resolve-start"
  to = "/.netlify/functions/predict-resolve-start"
  status = 200

# Feedback plane: relay in-app feedback to a Discord webhook (server-side
# secret). No funds move; this never touches the agent/predict/bet logic.
[[redirects]]
  from = "/api/submit-feedback"
  to = "/.netlify/functions/submit-feedback"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  # Web search + multi-round reasoning needs more than the 30s default
  included_files = []
  node_bundler = "esbuild"
  external_node_modules = ["@circle-fin/x402-batching", "@x402/core", "@x402/evm"]
[functions."predict-analyze"]
  timeout = 60
[functions."predict-resolve-propose"]
  timeout = 60
