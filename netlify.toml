[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Session auth (Brick 1): SIWE-style challenge + verify. Issues the session token
# that the money-moving endpoints require. No funds move here.
[[redirects]]
  from = "/api/auth-challenge"
  to = "/.netlify/functions/auth-challenge"
  status = 200
[[redirects]]
  from = "/api/auth-verify"
  to = "/.netlify/functions/auth-verify"
  status = 200

# Per-user agent wallet (Brick 2a): resolve/provision the caller's own wallet
# from their session. No funds move.
[[redirects]]
  from = "/api/my-wallet"
  to = "/.netlify/functions/my-wallet"
  status = 200

# Send USDC from the caller's own agent wallet (session-resolved).
[[redirects]]
  from = "/api/agent-send"
  to = "/.netlify/functions/agent-send"
  status = 200

# Friendly /api/* routes -> serverless functions (the AGENT plane).
[[redirects]]
  from = "/api/agent-init"
  to = "/.netlify/functions/agent-init"
  status = 200
[[redirects]]
  from = "/api/agent-status"
  to = "/.netlify/functions/agent-status"
  status = 200
[[redirects]]
  from = "/api/agent-act"
  to = "/.netlify/functions/agent-act"
  status = 200
[[redirects]]
  from = "/api/agent-execute-plan"
  to = "/.netlify/functions/agent-execute-plan"
  status = 200

# Cross-chain bridge (propose→confirm→execute). agent-bridge EXECUTES the Arc
# burn from the caller's session-resolved wallet; agent-bridge-status is a
# read-only poll for the async destination mint. Both session-gated.
# Unified Balance cross-chain SPEND (first proof). Cap-guarded in the wrapper before
# any UB call; delegate-signed Arc→Base Sepolia via the Forwarding Service.
[[redirects]]
  from = "/api/agent-ub-spend"
  to = "/.netlify/functions/agent-ub-spend"
  status = 200

# Unified Balance FUNDING (deposit) — ASYNC. agent-ub-deposit is the SYNC front door: it
# enforces auth + the per-deposit cap + the funds check (every REJECTION answers immediately),
# then hands the slow on-chain half to agent-ub-deposit-background and returns 202 with a
# depositId. The client polls agent-ub-deposit-status.
#
# The split exists because the deposit runs two sequential txs (approve → deposit, 2–3s each)
# plus the one-time addDelegate grant, which sat at ~64% of Netlify's 10s SYNC ceiling even
# after waitForTx was tightened (8938ms → 6442ms, measured). Background functions get 15 min.
#
# agent-ub-deposit-background gets NO public route on purpose — it is invoked internally
# (x-internal-token) and is UNCAPPED. A public route on it would be an uncapped deposit.
[[redirects]]
  from = "/api/agent-ub-deposit"
  to = "/.netlify/functions/agent-ub-deposit"
  status = 200
[[redirects]]
  from = "/api/agent-ub-deposit-status"
  to = "/.netlify/functions/agent-ub-deposit-status"
  status = 200

# Proposal loop — APPROVE a server-authored bridge proposal. Reads ONLY {runId} from the
# client; destination/amount come from the persisted proposal, burnHash from the server's
# own executeAction return. The mint is re-verified on-chain by the background verifier
# (job-bridge-receipt-background, internal-only, no public route).
[[redirects]]
  from = "/api/job-bridge-approve"
  to = "/.netlify/functions/job-bridge-approve"
  status = 200

# Proposal loop — APPROVE a server-authored SWAP proposal (USDC↔EURC on Arc). Same trust
# boundary as the bridge approve: {runId} is the ONLY field read from the client; tokens,
# amount and the USDC-equivalent cap are re-derived from the persisted, server-authored
# proposal. The swap is verified same-chain by job-swap-receipt-background — internal-only,
# NO public route (it writes receipts; a public route would let anyone forge one).
[[redirects]]
  from = "/api/job-swap-approve"
  to = "/.netlify/functions/job-swap-approve"
  status = 200

# The AGENTS PAGE — a roster (GET) plus the pause/resume switch (POST). Owner-scoped to the
# verified session: there is no read-anyone-else's-agents path and no pause-anyone-else's path.
# The kill switch is ENFORCED at every spend path (_pause.mjs), not just at executeAction —
# agent-send and agent-ub-spend move funds without it, and the researcher spends in job-run
# and mid-research. A pause one path routes around is not a pause.
[[redirects]]
  from = "/api/agents"
  to = "/.netlify/functions/agents"
  status = 200

[[redirects]]
  from = "/api/agent-bridge"
  to = "/.netlify/functions/agent-bridge"
  status = 200
[[redirects]]
  from = "/api/agent-bridge-status"
  to = "/.netlify/functions/agent-bridge-status"
  status = 200
[[redirects]]
  from = "/api/predict-markets"
  to = "/.netlify/functions/predict-markets"
  status = 200

# Gateway plane: read the unified balance. The deposit path is /api/agent-ub-deposit
# (capped via _arc.mjs's fail-closed ubDepositCapUsdc). The old /api/gateway-deposit was
# REMOVED: it had zero callers and re-derived its own cap as
# `Number(process.env.AGENT_MAX_SPEND_USDC || "1")`, which is fail-OPEN — a garbled env
# value yields NaN, and `amount > NaN` is always false, so every spend passed. That is the
# exact trap the fail-closed helper in _arc.mjs exists to prevent.
[[redirects]]
  from = "/api/gateway-balance"
  to = "/.netlify/functions/gateway-balance"
  status = 200

# Feedback plane: relay in-app feedback to a Discord webhook (server-side
# secret). No funds move; this never touches the agent/predict/bet logic.
[[redirects]]
  from = "/api/submit-feedback"
  to = "/.netlify/functions/submit-feedback"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  included_files = []
  node_bundler = "esbuild"
  external_node_modules = ["@circle-fin/x402-batching", "@x402/core", "@x402/evm"]

# Autonomous provisioning-stall sweep — runs every minute, re-fires runs stranded at
# "starting" (Netlify occasionally acks a *-background invocation without running it).
# The in-code `export const config = { schedule }` in job-sweep.mjs was not picked up by
# the CLI deploy; this is the canonical registration. Blobs access + logic already proven
# via a manual invoke (listed=68 reFired=0).
[functions."job-sweep"]
  schedule = "* * * * *"
