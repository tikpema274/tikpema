[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Session auth (Brick 1): SIWE-style challenge + verify. Issues the session token
# that the money-moving endpoints require. No funds move here.
[[redirects]]
  from = "/api/auth-challenge"
  to = "/.netlify/functions/auth-challenge"
  status = 200
[[redirects]]
  from = "/api/auth-verify"
  to = "/.netlify/functions/auth-verify"
  status = 200

# Per-user agent wallet (Brick 2a): resolve/provision the caller's own wallet
# from their session. No funds move.
[[redirects]]
  from = "/api/my-wallet"
  to = "/.netlify/functions/my-wallet"
  status = 200

# Send USDC from the caller's own agent wallet (session-resolved).
[[redirects]]
  from = "/api/agent-send"
  to = "/.netlify/functions/agent-send"
  status = 200

# DD engine — read-only on-chain due diligence. A NEW route on a NEW function; it imports nothing
# from _vault.mjs and cannot reach the deposit path. No payment and no auth yet (step 1 of 3), so it
# spends RPC quota and Circle signing calls on demand — intended for DRAFT deploys until step 2 adds
# payment. Every response, including every refusal, is the same report schema.
[[redirects]]
  from = "/api/dd-analyze"
  to = "/.netlify/functions/dd-analyze"
  status = 200

# Unified Balance EXIT — the user reclaiming their own Gateway balance.
# GET = their exit state + open withdrawals. POST = start the ~7 day delay.
# ⭐ A RECLAIM, NOT A SPEND — same reasoning as agent-withdraw below, one layer up: those
# controls bound what the AGENT may spend, and a paused agent must never trap the user's money.
# No `to` param anywhere; withdraw(address) takes no beneficiary, so funds can only land in the
# caller's own SCA.
# ═══ 🚨 THESE WERE MISSING, AND THE DCA PANEL WAS 404ing IN PRODUCTION ═══════════════════
# src/lib/agentClient.ts has called "/api/dca-create", "/api/dca-cancel" and "/api/dca-list" since
# 19405ad, and netlify.toml never had a redirect for any of them. All three returned 404 (SPA HTML)
# while /.netlify/functions/<name> returned 401 — so every action on the DCA page failed.
# ⭐ FOUND while adding those functions to the post-deploy smoke set: the smoke test insists on
# EXPLICIT paths rather than assuming the /api convention, and checking each one is what surfaced it.
# ⚠️ Redirects added rather than changing the client, because the client's expectation is the one
# that matches the other 31 /api routes — the job plane is the deliberate exception, this was not.
[[redirects]]
  from = "/api/dca-create"
  to = "/.netlify/functions/dca-create"
  status = 200

[[redirects]]
  from = "/api/dca-cancel"
  to = "/.netlify/functions/dca-cancel"
  status = 200

[[redirects]]
  from = "/api/dca-list"
  to = "/.netlify/functions/dca-list"
  status = 200

[[redirects]]
  from = "/api/ub-withdraw"
  to = "/.netlify/functions/ub-withdraw"
  status = 200

# Withdraw USDC from the caller's own agent wallet back to their own login wallet.
# Destination is session-resolved (no `to` param). Deliberately NOT bound by the agent's
# pause / day-ceiling / send-cap: those bound the agent, not the user reclaiming funds.
[[redirects]]
  from = "/api/agent-withdraw"
  to = "/.netlify/functions/agent-withdraw"
  status = 200

# Friendly /api/* routes -> serverless functions (the AGENT plane).
[[redirects]]
  from = "/api/agent-init"
  to = "/.netlify/functions/agent-init"
  status = 200
[[redirects]]
  from = "/api/agent-status"
  to = "/.netlify/functions/agent-status"
  status = 200
[[redirects]]
  from = "/api/agent-act"
  to = "/.netlify/functions/agent-act"
  status = 200
[[redirects]]
  from = "/api/agent-execute-plan"
  to = "/.netlify/functions/agent-execute-plan"
  status = 200

# Cross-chain bridge (propose→confirm→execute). agent-bridge EXECUTES the Arc
# burn from the caller's session-resolved wallet; agent-bridge-status is a
# read-only poll for the async destination mint. Both session-gated.
# Unified Balance cross-chain SPEND (first proof). Cap-guarded in the wrapper before
# any UB call; delegate-signed Arc→Base Sepolia via the Forwarding Service.
[[redirects]]
  from = "/api/agent-ub-spend"
  to = "/.netlify/functions/agent-ub-spend"
  status = 200

# Unified Balance FUNDING (deposit) — ASYNC. agent-ub-deposit is the SYNC front door: it
# enforces auth + the per-deposit cap + the funds check (every REJECTION answers immediately),
# then hands the slow on-chain half to agent-ub-deposit-background and returns 202 with a
# depositId. The client polls agent-ub-deposit-status.
#
# The split exists because the deposit runs two sequential txs (approve → deposit, 2–3s each)
# plus the one-time addDelegate grant, which sat at ~64% of Netlify's 10s SYNC ceiling even
# after waitForTx was tightened (8938ms → 6442ms, measured). Background functions get 15 min.
#
# agent-ub-deposit-background gets NO public route on purpose — it is invoked internally
# (x-internal-token) and is UNCAPPED. A public route on it would be an uncapped deposit.
[[redirects]]
  from = "/api/agent-ub-deposit"
  to = "/.netlify/functions/agent-ub-deposit"
  status = 200
[[redirects]]
  from = "/api/agent-ub-deposit-status"
  to = "/.netlify/functions/agent-ub-deposit-status"
  status = 200

# Proposal loop — APPROVE a server-authored bridge proposal. Reads ONLY {runId} from the
# client; destination/amount come from the persisted proposal, burnHash from the server's
# own executeAction return. The mint is re-verified on-chain by the background verifier
# (job-bridge-receipt-background, internal-only, no public route).
[[redirects]]
  from = "/api/job-bridge-approve"
  to = "/.netlify/functions/job-bridge-approve"
  status = 200

# Proposal loop — APPROVE a server-authored SWAP proposal (USDC↔EURC on Arc). Same trust
# boundary as the bridge approve: {runId} is the ONLY field read from the client; tokens,
# amount and the USDC-equivalent cap are re-derived from the persisted, server-authored
# proposal. The swap is verified same-chain by job-swap-receipt-background — internal-only,
# NO public route (it writes receipts; a public route would let anyone forge one).
[[redirects]]
  from = "/api/job-swap-approve"
  to = "/.netlify/functions/job-swap-approve"
  status = 200

# The AGENTS PAGE — a roster (GET) plus the pause/resume switch (POST). Owner-scoped to the
# verified session: there is no read-anyone-else's-agents path and no pause-anyone-else's path.
# The kill switch is ENFORCED at every spend path (_pause.mjs), not just at executeAction —
# agent-send and agent-ub-spend move funds without it, and the researcher spends in job-run
# and mid-research. A pause one path routes around is not a pause.
[[redirects]]
  from = "/api/agents"
  to = "/.netlify/functions/agents"
  status = 200

[[redirects]]
  from = "/api/agent-bridge"
  to = "/.netlify/functions/agent-bridge"
  status = 200
[[redirects]]
  from = "/api/agent-bridge-status"
  to = "/.netlify/functions/agent-bridge-status"
  status = 200
# Owner-scoped list of the caller's own bridge receipts — survives a reload, which
# component state did not. Session-gated, read-only.
# 🚨 DELIBERATELY ABSENT: any route for bridge-mint-settle-background. It MUTATES
# receipt state and is internal-only (requireInternal). Netlify exposes every function
# at /.netlify/functions/* regardless, so the guard is in the code, not in this file.
[[redirects]]
  from = "/api/bridge-receipts"
  to = "/.netlify/functions/bridge-receipts"
  status = 200
[[redirects]]
  from = "/api/predict-markets"
  to = "/.netlify/functions/predict-markets"
  status = 200

# Gateway plane: read the unified balance. The deposit path is /api/agent-ub-deposit
# (capped via _arc.mjs's fail-closed ubDepositCapUsdc). The old /api/gateway-deposit was
# REMOVED: it had zero callers and re-derived its own cap as
# `Number(process.env.AGENT_MAX_SPEND_USDC || "1")`, which is fail-OPEN — a garbled env
# value yields NaN, and `amount > NaN` is always false, so every spend passed. That is the
# exact trap the fail-closed helper in _arc.mjs exists to prevent.
[[redirects]]
  from = "/api/gateway-balance"
  to = "/.netlify/functions/gateway-balance"
  status = 200

# Feedback plane: relay in-app feedback to a Discord webhook (server-side
# secret). No funds move; this never touches the agent/predict/bet logic.
[[redirects]]
  from = "/api/submit-feedback"
  to = "/.netlify/functions/submit-feedback"
  status = 200

# Parameters plane: read an agent's CURRENT, MUTABLE caps and limits. Read-only, no auth, no
# writes, nothing on-chain — the numbers come from the same fail-closed helpers the money paths
# enforce (_arc.mjs), so this view cannot drift from what is actually enforced. The response
# keeps mutable `parameters` and immutable `invariants` in separate blocks on purpose: a cap is
# a dial an operator can turn, "the Researcher cannot move funds" is a wall it cannot.
# Must precede the SPA fallback, or /* would swallow it and return index.html.
[[redirects]]
  from = "/api/agent-parameters/:agent"
  to = "/.netlify/functions/agent-parameters?agent=:agent"
  status = 200
[[redirects]]
  from = "/api/agent-parameters"
  to = "/.netlify/functions/agent-parameters"
  status = 200

# ⚠️ /api/v1/… — THE CANONICAL, FROZEN PATH. DO NOT EVER CHANGE OR REMOVE THESE TWO RULES.
#
# This URL is about to be hardcoded into an IPFS document whose CID is written into an ERC-8004
# agent identity on a public chain. Once that lands, the pointer is IMMUTABLE and permanent: the
# chain will point at this path forever, and we cannot edit the document to follow a move. A
# future API restructure MUST leave these rules standing — add new versions alongside, never
# rename or retire /api/v1/agent-parameters.
#
# It is `v1` precisely so the rest of the API stays free to change. The unversioned path below
# it remains as a convenience ALIAS for existing callers; the versioned one is the contract.
#
# Both must precede the SPA fallback, or /* swallows them and returns index.html.
[[redirects]]
  from = "/api/v1/agent-parameters/:agent"
  to = "/.netlify/functions/agent-parameters?agent=:agent"
  status = 200
[[redirects]]
  from = "/api/v1/agent-parameters"
  to = "/.netlify/functions/agent-parameters"
  status = 200

# Vault agent — inspect an allowlisted ERC-4626 vault (read-only), then deposit/withdraw.
# Must precede the SPA fallback, or /* swallows them and returns index.html (a 200 HTML page
# the client's r.json() then chokes on).
[[redirects]]
  from = "/api/agent-vault-inspect"
  to = "/.netlify/functions/agent-vault-inspect"
  status = 200
[[redirects]]
  from = "/api/agent-vault-deposit"
  to = "/.netlify/functions/agent-vault-deposit"
  status = 200
[[redirects]]
  from = "/api/agent-vault-withdraw"
  to = "/.netlify/functions/agent-vault-withdraw"
  status = 200
[[redirects]]
  from = "/api/agent-vault-shares"
  to = "/.netlify/functions/agent-vault-shares"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  included_files = []
  node_bundler = "esbuild"
  external_node_modules = ["@circle-fin/x402-batching", "@x402/core", "@x402/evm"]

# Autonomous provisioning-stall sweep — runs every minute, re-fires runs stranded at
# "starting" (Netlify occasionally acks a *-background invocation without running it).
# The in-code `export const config = { schedule }` in job-sweep.mjs was not picked up by
# the CLI deploy; this is the canonical registration. Blobs access + logic already proven
# via a manual invoke (listed=68 reFired=0).
[functions."job-sweep"]
  schedule = "* * * * *"

# DCA scheduler — runs every minute, fills due DCA mandates autonomously (custodial swaps
# while the user is offline). Registered HERE (not the in-code config) for the same reason as
# job-sweep: the CLI deploy does not pick up `export const config = { schedule }`. Every fill
# routes through executeAction, so it inherits pause + per-swap cap + day ceiling; the tick
# writes an unconditional heartbeat to the dca-heartbeat store so liveness is checkable.
[functions."dca-tick"]
  schedule = "* * * * *"

# DD canary — re-runs the known-shape fixtures and refreshes the health artifact the DD service
# needs in order to serve at all. SAFE-PUBLIC by construction, not by guarding: the handler reads
# NOTHING from the request except `event.blobs` (platform-injected), so no caller can steer the
# verdict, skip a fixture, or assert health. The worst a public hit achieves is making it RUN, and
# every run writes the truth.
#
# ⚠️ THE PERIOD IS PART OF A LOAD-BEARING ORDERING: MIN_RERUN_MS (5m) < this period (10m) <
# DEFAULT_TTL_MS (30m). Shorten this below the dedupe window and the SCHEDULED run would dedupe
# itself, the artifact would stop refreshing, and the service would refuse on staleness. Lengthen it
# past the TTL and the service refuses between runs. The acceptance test asserts this ordering
# against this very file — change one number and it fails.
#
# Guards the DD SERVICE ONLY: dd-canary imports nothing from _vault.mjs or _pause.mjs and writes to
# its own blob store (dd-canary-health, not agent-pause).
[functions."dd-canary"]
  schedule = "*/10 * * * *"

# Bridge receipt sweeper — finds stranded receipts across ALL owners and asks the settler
# to resolve them. Recovery previously rode the owner-scoped read, which needs a live
# session + the owning wallet + a page that calls it; on 2026-08-01 each failed
# independently while a receipt sat stranded for 7h58m with its mint already on Base.
# ⭐ The case only a cron can cover: a user who bridges once and never returns.
# Every 10 min — the mint deadline is 4 min, so staleness is bounded at ~10.
# 🚨 NOT HTTP-invokable (Netlify 403s scheduled functions) and deliberately no /api route.
[functions."bridge-mint-sweep"]
  schedule = "*/10 * * * *"

# UB withdrawal sweeper — drives HOP 2 of the exit: the withdraw() call that lands a matured
# Gateway balance back in the user's agent SCA.
#
# 🚨 THIS SCHEDULE IS WHAT MAKES THE EXIT AN EXIT. The exit is two on-chain calls ~7 days apart.
# If the second required the user to come back and click, the design collapses into a clock
# started that nobody finishes while the user believes they are leaving. On the bridge, "a user
# who never comes back" was the EDGE case; for a WITHDRAWAL it is the ORDINARY one — someone
# asking for their money back is, by definition, leaving.
#
# ⚠️ Every 30 min against a ~7 DAY delay, so the period only bounds how long a MATURED
# withdrawal waits after maturing — minutes against a week. Sweeping harder buys nothing and
# costs RPC on every tick for every open record.
#
# 🚨 NO AUTH GUARD, DELIBERATELY. Netlify 403s HTTP invocation of a scheduled function, and
# dd-watch shipped a guard keyed on httpMethod on 2026-08-11 that REFUSED ITS OWN CRON for five
# runs — nothing written, no error anywhere. A sweeper must never be able to refuse itself.
[functions."ub-withdraw-sweep"]
  schedule = "*/30 * * * *"

# DD availability watch — is the PUBLIC DD SERVICE answering, on BOTH of its paths?
#
# ⭐ THE PROBE IS FREE. dd-analyze's rungs are exposure(-1) -> retrieve(-0.5) -> HEALTH(0) -> ... ->
# payment(6), so an unauthenticated POST can only reach the 402 challenge: it never settles, never
# charges, needs no session. 402 = past the health rung, 503 = refusing. That is why this can run
# every 5 minutes forever.
#
# ⚠️ LOAD-BEARING ORDERING, WITH NUMBERS DELIBERATELY UNLIKE THE OTHER TWO MONITORS:
# MIN_RERUN_MS (3m) < this period (5m) < TTL_MS (20m). They differ from dd-canary's 5/10/30 and from
# strong-read-watch's 7/15/45 so nobody assumes one monitor covers another.
#
# ⭐ AND THE GRACE WINDOW IS SIZED AGAINST THE CANARY, NOT AGAINST THIS PERIOD: a DD-code deploy
# rotates the health key, so `no-record` is CORRECT for up to a */10 canary period. Alerting on that
# would fire on every DD deploy BY CONSTRUCTION, and an alert that fires on routine work is one
# nobody reads. Grace = 2 canary periods (20m); first alert lands at ~t+25m.
#
# ⚠️ SEPARATE FROM strong-read-watch by design: that guards the MONEY path, this guards DD
# AVAILABILITY. Own store, own channel (DD_WATCH_WEBHOOK) — muting is per-channel, so a chatty DD
# alert sharing the money channel would take the siren that matters down with it.
[functions."dd-watch"]
  schedule = "*/5 * * * *"

# Strong-read watch — is the TIKPEMA APP's money path still able to do a strong Blobs read on prod?
#
# ⚠️ DELIBERATELY NOT PART OF dd-canary. That one guards the DD ENGINE, which is going standalone
# and will leave this repo; this one guards the kill switch and the spend ceiling. Folding them
# together would mean pause and budget silently lose their monitor the day DD moves out.
#
# It makes ONE real HTTP request per run to the deployed blobs-probe. In-process would measure the
# SCHEDULED runtime rather than the runtime _pause.mjs executes in, and could go green while the
# kill switch is bricked.
#
# ⚠️ SAME LOAD-BEARING ORDERING AS THE CANARY, DIFFERENT NUMBERS ON PURPOSE:
# MIN_RERUN_MS (7m) < this period (15m) < TTL_MS (45m). Shorten this below the dedupe window and
# the SCHEDULED run dedupes itself into silence; lengthen it past the TTL and every record is stale
# on arrival. The numbers differ from dd-canary's 5/10/30 so nobody assumes one monitor covers the
# other. scripts/verify-strong-read-watch.mjs asserts this ordering against THIS FILE.
[functions."strong-read-watch"]
  schedule = "*/15 * * * *"
